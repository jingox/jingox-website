<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nav Item Design</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5.0.20/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5.0.20/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5.0.20/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5.0.20/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5.0.20/800.css">
<style>
:root{
  --bg:#121212;--surface:#1C1C22;--surface-2:#23232B;--surface-3:#2A2A34;
  --line:#2E2E38;--text:#E8E8EE;--text-dim:#A0A0AD;--muted-2:#848492;
  --blue:#2BB3DD;--blue-2:#0084AF;--blue-ink:#123A4A;--blue-border:#0E3A4C;
  --purple:#A78BFA;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:30px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:16px 20px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.row-label{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);width:150px;flex-shrink:0}
svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.item{display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;color:var(--text-dim);font-size:.95rem;font-weight:600;cursor:pointer;transition:.18s;position:relative}

/* ===== 样式1：胶囊高亮 ===== */
.s1 .item:hover{color:var(--text);background:var(--surface-3)}
.s1 .item.on{color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue-2));
  box-shadow:0 6px 18px rgba(43,179,221,.35)}
.s1 .item.on svg{color:#fff}

/* ===== 样式2：下划线指示器 ===== */
.s2 .item:hover{color:var(--text)}
.s2 .item:hover::after{opacity:.4}
.s2 .item::after{content:"";position:absolute;left:15px;right:15px;bottom:3px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--blue),var(--purple));opacity:0;transition:.2s}
.s2 .item.on{color:var(--blue)}
.s2 .item.on::after{opacity:1}

/* ===== 样式3：图标点亮 + 顶部小竖条 ===== */
.s3 .item:hover{color:var(--text)}
.s3 .item:hover svg{color:var(--blue)}
.s3 .item.on{color:var(--text);font-weight:700}
.s3 .item.on svg{color:var(--blue)}
.s3 .item.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--blue),var(--purple))}

/* ===== 样式4：发光描边胶囊 ===== */
.s4 .item:hover{color:var(--text);border-color:var(--border-strong)}
.s4 .item{border:1px solid transparent}
.s4 .item.on{color:var(--blue);border-color:var(--blue-border);background:rgba(43,179,221,.08);
  box-shadow:0 0 16px rgba(43,179,221,.18)}
</style>
</head>
<body>

<!-- SVG 图标库 -->
<svg style="position:absolute;width:0;height:0">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-factory" viewBox="0 0 24 24"><path d="M3 21V10l6 4V10l6 4V7l6 3v11z"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.5"/></symbol>
  <symbol id="i-faq" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .9-1 1.7M12 17v.5"/></symbol>
  <symbol id="i-blog" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></symbol>
</svg>

<!-- 样式1 -->
<div class="row s1">
  <div class="row-label">1 · 胶囊高亮</div>
  <div class="item on"><svg><use href="#i-home"/></svg>Home</div>
  <div class="item"><svg><use href="#i-grid"/></svg>Products</div>
  <div class="item"><svg><use href="#i-factory"/></svg>OEM</div>
  <div class="item"><svg><use href="#i-info"/></svg>About</div>
  <div class="item"><svg><use href="#i-faq"/></svg>FAQ</div>
  <div class="item"><svg><use href="#i-blog"/></svg>Blog</div>
</div>

<!-- 样式2 -->
<div class="row s2">
  <div class="row-label">2 · 下划线</div>
  <div class="item on"><svg><use href="#i-home"/></svg>Home</div>
  <div class="item"><svg><use href="#i-grid"/></svg>Products</div>
  <div class="item"><svg><use href="#i-factory"/></svg>OEM</div>
  <div class="item"><svg><use href="#i-info"/></svg>About</div>
  <div class="item"><svg><use href="#i-faq"/></svg>FAQ</div>
  <div class="item"><svg><use href="#i-blog"/></svg>Blog</div>
</div>

<!-- 样式3 -->
<div class="row s3">
  <div class="row-label">3 · 图标点亮</div>
  <div class="item on"><svg><use href="#i-home"/></svg>Home</div>
  <div class="item"><svg><use href="#i-grid"/></svg>Products</div>
  <div class="item"><svg><use href="#i-factory"/></svg>OEM</div>
  <div class="item"><svg><use href="#i-info"/></svg>About</div>
  <div class="item"><svg><use href="#i-faq"/></svg>FAQ</div>
  <div class="item"><svg><use href="#i-blog"/></svg>Blog</div>
</div>

<!-- 样式4 -->
<div class="row s4">
  <div class="row-label">4 · 发光描边</div>
  <div class="item on"><svg><use href="#i-home"/></svg>Home</div>
  <div class="item"><svg><use href="#i-grid"/></svg>Products</div>
  <div class="item"><svg><use href="#i-factory"/></svg>OEM</div>
  <div class="item"><svg><use href="#i-info"/></svg>About</div>
  <div class="item"><svg><use href="#i-faq"/></svg>FAQ</div>
  <div class="item"><svg><use href="#i-blog"/></svg>Blog</div>
</div>

</body>
</html>
